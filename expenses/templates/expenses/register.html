{% load static %}

<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="{% static 'css/auth.css' %}">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <title>Register</title>
</head>

<body>

  {% if error %}
  <div class="alert alert-danger">
    {{ error }}
  </div>
  {% endif %}

  <div class="container">

    <div class="">
      <h1>Start to manage your money from now</h1>
      <p>Manage your finances more easily and in a planned way</p>
    </div>

    <form method="post">
      {% csrf_token %}
      <div class="mb-3 mt-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" placeholder="Username..." name="username" />
      </div>
      <div class="mb-3 mt-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" placeholder="Email..." name="email" />
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>

        <div class="position-relative">
          <input type="password" class="form-control" id="password" name="password" placeholder="Password..."
            autocomplete="new-password" style="padding-right: 4rem;" required>

          <button type="button" class="position-absolute top-50 end-0 translate-middle-y
                       w-auto h-auto m-0 me-2 px-2 py-0 border-0 bg-transparent" style="color: #5145B5;"
            aria-controls="password" data-password-toggle>Show</button>
        </div>
      </div>

      <div class="mb-3">
        <label for="confirm_password" class="form-label">Confirm Password</label>

        <div class="position-relative">
          <input type="password" class="form-control" id="confirm_password" name="confirm_password"
            placeholder="Confirm..." autocomplete="new-password" style="padding-right: 4rem;" required>

          <button type="button" class="position-absolute top-50 end-0 translate-middle-y
                       w-auto h-auto m-0 me-2 px-2 py-0 border-0 bg-transparent" style="color: #5145B5;"
            aria-controls="confirm_password" data-password-toggle>Show</button>
        </div>
      </div>
      <div class="form-check mb-3">
        <label class="form-check-label">
          <input class="form-check-input" type="checkbox" name="remember" />
          Remember me
        </label>
      </div>
      <button type="submit" class="btn">Register</button>
    </form>
    <p>
      Already have an account?
      <a href="{% url 'login' %}" class="text-decoration-none">Login</a>
    </p>
  </div>

  <script src="{% static 'js/script.js' %}?v=6" defer></script>
</body>

</html>
