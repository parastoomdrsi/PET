{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Login</title>
</head>

<body>
    <div class="container">
        <div class="text-center">
            <h1>Welcome Back!</h1>
            <p>Sign in to your Personal Expense Tracker</p>
        </div>
        <div class="form">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3 mt-3">
                    <label for="username" class="form-label">Enter your username</label>
                    <input type="text" class="form-control" id="username" placeholder="Username..." name="username">
                </div>
                <div class="mb-3">
                    <label for="loginPassword" class="form-label">Password</label>

                    <div class="position-relative">
                        <input type="password" id="loginPassword" name="password" class="form-control"
                            style="padding-right: 4rem;" placeholder="Password..." autocomplete="current-password"
                            required>

                        <button type="button" id="togglePassword" class="position-absolute top-50 end-0 translate-middle-y
                   w-auto h-auto m-0 me-2 px-2 py-0 border-0 bg-transparent"
                            aria-controls="loginPassword">Show</button>
                    </div>
                </div>
                <p class="text-end"><a href="" class="text-decoration-none">Forgot password?</a></p>
                <button type="submit" class="btn">Sign in</button>
            </form>
        </div>
        <div class="text-center">
            <p><a href="" class="text-decoration-none">Sign in with Google</a></p>
            <p>
                Don't have an account?
                <a href="{% url 'register' %}" class="text-decoration-none">Sign Up</a>
            </p>
        </div>
    </div>

    <script src="{% static 'js/script.js' %}?v=5"></script>
</body>
</html>
