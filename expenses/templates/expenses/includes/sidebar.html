        <h4>Personal Expense Tracker</h4>
    </div>

    <nav class="sidebar-menu">

        <a href="{% url 'dashboard' %}"
            class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">

        </a>

        <a href="{% url 'transactions' %}">
            Transactions

        <a href="{% url 'categories' %}">
