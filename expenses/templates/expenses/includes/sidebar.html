{% load i18n %}

<!-- Sidebar -->
<aside class="sidebar">

    <div class="sidebar-brand">
        <h4>Personal Expense Tracker</h4>
    </div>

    <nav class="sidebar-menu">

        <a href="{% url 'dashboard' %}"
            class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
            {% translate "Dashboard" %}
        </a>

        <a href="{% url 'transactions' %}">
            {% translate "Transactions" %}
        </a>

        <a href="{% url 'categories' %}">
            {% translate "Categories" %}
        </a>

        <a href="{% url 'manage_budgets' %}"
            class="{% if request.resolver_match.url_name == 'manage_budgets' %}active{% endif %}">
            {% translate "Budgets" %}
        </a>

    </nav>

    <div class="sidebar-footer d-flex flex-row-reverse justify-content-between align-items-center" dir="ltr"> 
        {% get_current_language as current_language %}

        <form method="post" action="{% url 'set_language' %}" class="m-0">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ request.get_full_path }}">

            {% if current_language == "fa" %}
            <button type="submit" name="language" value="en" class="btn btn-sm btn-outline-light" lang="en">
                English
            </button>
            {% else %}
            <button type="submit" name="language" value="fa" class="btn btn-sm btn-outline-light" lang="fa">
                فارسی
            </button>
            {% endif %}
        </form>

        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="sidebar-logout">{% translate "Log out" %}</button>
        </form>
    </div>

</aside>
